    <!-- Visual Error Logger -->
    <div id="error-log" style="position: fixed; top: 0; left: 0; z-index: 99999; background: red; color: white; padding: 20px; font-size: 16px; font-family: monospace; display: none; max-width: 100vw; word-wrap: break-word;"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var el = document.getElementById('error-log');
        el.style.display = 'block';
        el.innerHTML += 'Error: ' + message + ' at ' + source + ':' + lineno + '<br>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        var el = document.getElementById('error-log');
        el.style.display = 'block';
        el.innerHTML += 'Unhandled Promise Rejection: ' + (event.reason && event.reason.message ? event.reason.message : event.reason) + '<br>';
      });
    </script>

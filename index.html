    <script>
      (() => {
        const html = document.documentElement;
        html.classList.add('site-enhanced', 'site-booting');
        history.scrollRestoration = 'manual';
        let saved = 0;
        try {
          const navigation = performance.getEntriesByType('navigation')[0];
          if (navigation && ['reload','back_forward'].includes(navigation.type)) saved = Number(sessionStorage.getItem('portfolio:scroll')) || 0;
        } catch {}
        window.__portfolioBoot = { scrollY: saved };
        window.scrollTo(0, 0);
        window.__portfolioBootTimeout = setTimeout(() => html.classList.remove('site-booting'), 8000);
      })();
